                text: {
                    bm: `⚠️ *Sila semak tempoh notis dalam kontrak/rujuk supervisor atau PIC*

*Maklumat Pekerja*

Surat BM/BI?`,
                    en: `⚠️ *Please check the notice period in your contract/refer to your supervisor or PIC*

(Send a signature image if you want it included directly)

Malay or English letter?`
                }
            },
            leave: {
                title: { bm: "Borang Maklumat Surat Cuti Sekolah", en: "School Absence Information Form" },
                text: {
                    bm: `*Maklumat Waris (Penghantar Surat)*
* Nama penuh:
* Alamat surat-menyurat:
* Hubungan dengan pelajar (contoh: ibu/bapa/penjaga):

*Maklumat Penerima*

*Cuti*
* Sebab tidak hadir (contoh: sakit, urusan keluarga, lain-lain):
* Tarikh cuti:
* Tarikh surat:`,
                    en: `*Guardian Information (Letter Sender)*
* Full Name:
* Mailing Address:
* Relationship with student (e.g., mother/father/guardian):

*Recipient Information*
* Class Teacher Name:
* School Name:
* School Address:

*Student Information*
* Student Name:
* Student Class:

*Leave Details*
* Reason for Absence (e.g., sick, family matter, others):
* Absence Dates:
* Letter Date:`
                }
            }
        };

        window.addEventListener('scroll', () => {
            const toTopBtn = document.getElementById('to-top');
            if (window.scrollY > 400) {
                toTopBtn.classList.remove('opacity-0', 'translate-y-10', 'pointer-events-none');
                toTopBtn.classList.add('opacity-100', 'translate-y-0', 'pointer-events-auto');
            } else {
                toTopBtn.classList.add('opacity-0', 'translate-y-10', 'pointer-events-none');
                toTopBtn.classList.remove('opacity-100', 'translate-y-0', 'pointer-events-auto');
            }
        });

        function showToast(title, msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-title').innerText = title;
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-[-20px]');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-[-20px]');
                toast.classList.remove('opacity-100', 'translate-y-0');
            }, 4000);
        }

        function copyText(text) {
            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            showToast(content[currentLang].toastTitle, content[currentLang].copiedMsg);
        }

        function navigateTo(page) {
            currentPage = page;
            const backBtn = document.getElementById('floating-back');
            if (page === 'landing') {
                backBtn.classList.add('hidden');
                backBtn.classList.remove('flex');
            } else {
                backBtn.classList.remove('hidden');
                backBtn.classList.add('flex');
            }
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleLang() {
            currentLang = currentLang === 'bm' ? 'en' : 'bm';
            render();
        }

        function render() {
            const root = document.getElementById('app-root');
            document.getElementById('lang-label').innerText = currentLang === 'bm' ? 'English' : 'B. Melayu';

            if (currentPage === 'landing') {
                root.innerHTML = `
                    <div class="fade-in-content flex flex-col items-center w-full max-w-4xl px-4 sm:px-6 py-8 sm:py-16 relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-64 h-64 bg-pink-100/30 blur-[100px] -z-10 rounded-full pointer-events-none"></div>
                        
                        <header class="flex flex-col sm:flex-row items-center sm:items-start gap-6 sm:gap-10 mb-10 sm:mb-16 w-full relative text-center sm:text-left">
                            <div class="w-24 h-24 sm:w-32 sm:h-32 bg-white rounded-[2rem] flex items-center justify-center shadow-2xl shadow-pink-100 overflow-hidden border border-pink-50 group transition-all duration-500 hover:rotate-3 hover:scale-105 active:scale-95 shrink-0">
                                ${LOGO_URL ? `<img src="${LOGO_URL}" alt="Logo" class="w-full h-full object-cover">` : `
                                    <div class="bg-gradient-to-br from-pink-400 to-pink-600 w-full h-full flex items-center justify-center">
                                        <span class="text-white font-black text-2xl sm:text-3xl tracking-tighter group-hover:scale-110 transition-transform uppercase">IPA</span>
                                    </div>
                                `}
                            </div>
                            
                            <div class="flex flex-col justify-center">
                                <h1 class="text-3xl sm:text-5xl font-black text-slate-800 tracking-tight mb-3 sm:mb-4 leading-tight">
                                    ${content[currentLang].title}
                                </h1>
                                <p class="text-base sm:text-xl text-slate-500 font-medium leading-relaxed opacity-80 max-w-xl">
                                    ${content[currentLang].subtitle}
                                </p>
                            </div>
                        </header>

                        <div class="w-full grid gap-4 sm:gap-6">
                            ${Object.keys(templates).map(id => `
                                <button onclick="navigateTo('${id}')" class="group relative w-full flex items-center justify-between p-5 sm:p-7 bg-white border border-slate-100 rounded-[1.5rem] sm:rounded-[2rem] shadow-sm hover:shadow-xl hover:shadow-pink-100 hover:border-pink-200 active:bg-slate-50 transition-all duration-300 text-left overflow-hidden">
                                    <div class="absolute top-0 right-0 w-32 h-32 bg-pink-50/50 rounded-full blur-3xl -z-10 translate-x-16 -translate-y-16 group-hover:scale-150 transition-transform duration-700 pointer-events-none"></div>
                                    <div class="flex items-center gap-4 sm:gap-6">
                                        <div class="p-3 sm:p-4 bg-gradient-to-br from-pink-400 to-rose-400 rounded-2xl sm:rounded-[1.25rem] text-white shadow-lg shadow-pink-200/50 transform transition-transform group-hover:rotate-6">
                                            ${getIcon(id)}
                                        </div>
                                        <div class="flex flex-col">
                                            <span class="text-lg sm:text-2xl font-bold text-slate-800 group-hover:text-pink-600 transition-colors">
                                                ${content[currentLang].forms[id]}
                                            </span>
                                            <span class="text-xs sm:text-sm font-semibold text-slate-400 group-hover:text-slate-500">
                                                ${currentLang === 'bm' ? 'Klik untuk copy borang' : 'Click to copy template'}
                                            </span>
                                        </div>
                                    </div>
                                    <div class="text-slate-300 group-hover:text-pink-500 transform group-hover:translate-x-2 transition-all duration-300">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="rotate-180"><path d="m15 18-6-6 6-6"/></svg>
                                    </div>
                                </button>
                            `).join('')}
                        </div>

                        <footer class="mt-20 sm:mt-32 text-center w-full px-4 border-t border-slate-100 pt-10">
                            <p class="text-slate-400 text-xs sm:text-sm font-bold tracking-widest mb-8 uppercase">${content[currentLang].footer}</p>
                            <div class="flex gap-4 sm:gap-8 justify-center">
                                <a href="${TIKTOK_URL}" target="_blank" class="w-12 h-12 sm:w-16 sm:h-16 flex items-center justify-center text-slate-400 hover:text-pink-500 hover:bg-pink-50 rounded-3xl transition-all duration-300">
                                    <svg class="w-6 h-6 sm:w-8 sm:h-8 fill-current" viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1.04-.1z"/></svg>
                                </a>
                                <a href="${FACEBOOK_URL}" target="_blank" class="w-12 h-12 sm:w-16 sm:h-16 flex items-center justify-center text-slate-400 hover:text-pink-500 hover:bg-pink-50 rounded-3xl transition-all duration-300">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6 sm:w-8 sm:h-8"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
                                </a>
                                <a href="${INSTAGRAM_URL}" target="_blank" class="w-12 h-12 sm:w-16 sm:h-16 flex items-center justify-center text-slate-400 hover:text-pink-500 hover:bg-pink-50 rounded-3xl transition-all duration-300">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6 sm:w-8 sm:h-8"><rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/></svg>
                                </a>
                            </div>
                        </footer>
                    </div>
                `;
            } else {
                const template = templates[currentPage];
                root.innerHTML = `
                    <div class="fade-in-content w-full max-w-5xl px-4 py-8 sm:py-12 relative overflow-hidden mt-16 sm:mt-20">
                        <div class="bg-white rounded-[2rem] sm:rounded-[3rem] border border-slate-100 shadow-2xl shadow-slate-200/50 overflow-hidden flex flex-col">
                            <div class="p-6 sm:p-10 border-b border-slate-50 flex flex-col sm:flex-row sm:items-center justify-between gap-6 bg-white/80 backdrop-blur-xl sticky top-0 z-20">
                                <div class="flex flex-col gap-1 text-left">
                                    <h2 class="text-xl sm:text-3xl font-black text-slate-800 leading-tight">
                                        ${template.title[currentLang]}
                                    </h2>
                                </div>
                                <div class="flex flex-wrap gap-3">
                                    <button onclick="copyText(templates['${currentPage}'].text['${currentLang}'])" class="group flex items-center justify-center gap-3 bg-slate-900 text-white px-6 py-4 rounded-2xl hover:bg-pink-600 active:scale-95 transition-all shadow-xl shadow-slate-200">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="group-hover:-rotate-12 transition-transform"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                                        <span class="font-bold sm:text-lg">${content[currentLang].copyBtn}</span>
                                    </button>
                                    <a href="${WHATSAPP_URL}" target="_blank" class="group flex items-center justify-center gap-3 bg-green-500 text-white px-6 py-4 rounded-2xl hover:bg-green-600 active:scale-95 transition-all shadow-xl shadow-green-100">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="group-hover:scale-110 transition-transform"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                                        <span class="font-bold sm:text-lg">${content[currentLang].whatsappBtn}</span>
                                    </a>
                                </div>
                            </div>
                            
                            <div class="p-4 sm:p-10 bg-slate-50 flex-grow min-h-[500px]">
                                <div class="bg-white p-6 sm:p-14 rounded-3xl border border-slate-200 shadow-inner relative overflow-hidden">
                                    <div class="absolute inset-0 opacity-[0.03] pointer-events-none" style="background-image: radial-gradient(#000 0.5px, transparent 0.5px); background-size: 24px 24px;"></div>
                                    <pre class="relative whitespace-pre-wrap break-words font-mono text-xs sm:text-base text-slate-700 leading-relaxed overflow-x-auto max-w-full selection:bg-pink-100 selection:text-pink-600">
${template.text[currentLang]}
                                    </pre>
                                </div>
                            </div>
                        </div>

                        <div class="mt-10 p-6 sm:p-10 bg-slate-900 rounded-[2rem] text-slate-300 text-center shadow-2xl shadow-slate-200">
                            <p class="text-sm sm:text-lg font-medium leading-relaxed">
                                ${content[currentLang].hint}
                            </p>
                        </div>
                    </div>
                `;
            }
        }

        function getIcon(id) {
            const icons = {
                resume: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>`,
                internship: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="7" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>`,
                general: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>`,
                resign: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>`,
                leave: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>`
            };
            return icons[id] || '';
        }

        render();
    </script>
</body>
</html>
